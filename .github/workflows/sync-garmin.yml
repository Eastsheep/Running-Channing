name: 同步 Garmin 跑步紀錄

on:
  schedule:
    # 台灣時間每天 06:00 與 22:00
    - cron: "0 22 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "garminconnect==0.3.20" "cryptography>=42"
      - name: 抓取並加密
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
        run: python scripts/sync_garmin.py
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs.enc.json
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "自動同步 Garmin 跑步紀錄"
          git push
